# mobile-management: Bluetooth kernel modules blacklisted by default.
# Modules are loaded on demand by mobile-management.service when the
# feature is enabled via: config feature state mobile-management enabled
#
# Load order (when enabled) follows USB BT dependency chain:
#   bluetooth -> btrtl/btbcm/btintel/btmtk -> btusb
blacklist bluetooth
blacklist btrtl
blacklist btbcm
blacklist btintel
blacklist btmtk
blacklist btusb
